# Apple Silicon (Aurora Fedora Remix)
# omarchy-mac: gpu + OpenGL with vaapi-copy (1080p ~55 % -> 13 % of a core on M2 Max; Vulkan = green frames).
vo=gpu
gpu-api=opengl
# Aurora: AVD through VA-API (libva-v4l2-request-avd). ffmpeg-free has no native H.264/HEVC decoder, so VP9 only;
# copy mode: zero-copy vaapi renders green (omarchy-mac).
hwdec=vaapi-copy

# Playback
profile=high-quality
keep-open=yes
save-position-on-quit=yes
hr-seek-framedrop=no
cache=yes
demuxer-max-bytes=100M
demuxer-max-back-bytes=50M
audio-stream-silence=yes
audio-file-auto=fuzzy
audio-pitch-correction=yes
volume-max=150

# Window
border=no
autofit=85%x85%
cursor-autohide=100
msg-color=yes
msg-module=yes

# Subtitles
sub-auto=fuzzy
sub-file-paths-append=ass
sub-file-paths-append=srt
sub-file-paths-append=sub
sub-file-paths-append=subs
sub-file-paths-append=subtitles
embeddedfonts=yes
demuxer-mkv-subtitle-preroll=yes
sub-fix-timing=no

# Language priority
alang=jpn,jp,eng,en,enUS,en-US,de,ger
slang=eng,en,und,de,ger,jp,jap

[protocol.http]
hls-bitrate=max
cache=yes
no-cache-pause

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile=protocol.http
