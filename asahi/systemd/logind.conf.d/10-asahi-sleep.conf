# Asahi: no disk hibernation (s2idle only). Ignore a tap of the Touch ID /
# power button so it cannot poweroff the session; a several-second hardware
# hold still force-resets via SMC (logind never sees that). Give hyprlock
# time on lid close before logind suspends — a 5s default is not enough
# when the panel also has to settle.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleHibernateKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKeyLongPress=ignore
InhibitDelayMaxSec=15
