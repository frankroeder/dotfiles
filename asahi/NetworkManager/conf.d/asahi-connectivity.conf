# Let NetworkManager report portal/limited/full (omarchy 4.5): the pane and the
# bar chip read the cached state, and the captive-portal opener waits on it.
# Documented pair from man NetworkManager.conf. Plain HTTP on purpose: a
# portal must intercept it. Never point this at an HSTS-preloaded host.
[connectivity]
uri=http://nmcheck.gnome.org/check_network_status.txt
response=NetworkManager is online
