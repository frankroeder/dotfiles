# Disable Wi-Fi power save. NM values: 0=default 1=ignore 2=disable 3=enable.
# Idle naps add 20–300ms latency (and some firmware drops the link). This
# machine is used continuously — sleeping the radio is not worth the wait.
# [connection] defaults cover every profile whose own wifi.powersave is 0 (default).
[connection]
wifi.powersave = 2
