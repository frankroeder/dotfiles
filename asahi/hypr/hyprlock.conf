$font = Cascadia Mono NF
$lock_wall = ~/.local/state/asahi/lock-wallpaper

# Mocha fallback, then wallpaper-adaptive colors from asahi-autotheme.
source = ~/.dotfiles/asahi/hypr/hyprlock-theme.conf
source = ~/.local/state/asahi-theme/hyprlock.conf

general {
  hide_cursor = true
  ignore_empty_input = true
  immediate_render = true
}

auth {
  pam:enabled = true
}

animations {
  enabled = true
  bezier = linear, 1, 1, 0, 0
  animation = fadeIn, 1, 5, linear
  animation = fadeOut, 1, 5, linear
  animation = inputFieldDots, 1, 2, linear
}

background {
  monitor =
  path = $lock_wall
  color = $lock_bg
  blur_passes = 2
  blur_size = 3
  brightness = 0.55
  contrast = 1.05
}

label {
  monitor =
  text = $TIME
  color = $lock_accent
  font_size = 84
  font_family = $font
  shadow_passes = 2
  shadow_size = 4
  shadow_color = $lock_shadow
  position = 0, 125
  halign = center
  valign = center
  zindex = 1
}

label {
  monitor =
  text = cmd[update:60000] date +"%A, %d %B %Y"
  color = $lock_accent
  font_size = 24
  font_family = $font
  position = 0, 60
  halign = center
  valign = center
  zindex = 1
}

input-field {
  monitor =
  size = 22%, 5%
  outline_thickness = 4
  inner_color = rgba(0, 0, 0, 0.0)
  outer_color = $lock_outer
  check_color = $lock_check
  fail_color = $lock_fail_grad
  font_color = $lock_fg
  font_family = $font
  fade_on_empty = false
  rounding = 15
  placeholder_text = Enter password...
  fail_text = $PAMFAIL
  dots_spacing = 0.3
  shadow_passes = 2
  shadow_size = 4
  shadow_color = $lock_shadow
  position = 0, -45
  halign = center
  valign = center
  zindex = 1
}

label {
  monitor =
  text = Locked for $USER
  color = $lock_muted
  font_size = 16
  font_family = $font
  position = 0, -115
  halign = center
  valign = center
  zindex = 1
}

label {
  monitor =
  text = cmd[update:5000] ~/.dotfiles/asahi/bin/asahi-battery text
  color = $lock_muted
  font_size = 32
  font_family = $font
  position = 48, 40
  halign = left
  valign = bottom
  zindex = 1
}

label {
  monitor =
  text = cmd[update:60000] uptime -p
  color = $lock_muted
  font_size = 32
  font_family = $font
  position = -48, 40
  halign = right
  valign = bottom
  zindex = 1
}
