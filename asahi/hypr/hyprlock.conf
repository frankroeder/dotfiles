$font = Cascadia Mono NF
$lock_wall = ~/.local/state/asahi/lock-wallpaper

# Mocha fallback, then wallpaper-adaptive colors from asahi-autotheme.
source = ~/.dotfiles/asahi/hypr/hyprlock-theme.conf
source = ~/.local/state/asahi-theme/hyprlock.conf

# One centered row [uptime / battery]  [password]  [clock / date] at fixed offsets
# from the centre (hyprlock left/right anchor to the monitor edge), in the
# scheme's fg/muted on a flat band of the scheme's background. Positions are
# framebuffer pixels, y-up from the bottom edge; the row fits the Dell 2560.

general {
  hide_cursor = true
  ignore_empty_input = true
  immediate_render = true
}

auth {
  pam:enabled = true
}

animations {
  enabled = true
  bezier = linear, 1, 1, 0, 0
  animation = fadeIn, 1, 5, linear
  animation = fadeOut, 1, 5, linear
  animation = inputFieldDots, 1, 2, linear
}

background {
  monitor =
  path = $lock_wall
  color = $lock_bg
  blur_passes = 0
}

# Flat band in the scheme's background behind the row.
shape {
  monitor =
  size = 100%, 340
  color = $lock_band
  rounding = 0
  border_size = 0
  position = 0, 0
  halign = center
  valign = bottom
  zindex = 1
}

# Top fade behind the hostname (scheme background), written by asahi-autotheme.
# Left-anchored: hyprlock mis-centers images wider than the monitor.
image {
  monitor =
  path = ~/.local/state/asahi-theme/lock-fade-top.png
  size = 260
  rounding = 0
  border_size = 0
  position = 0, 0
  halign = left
  valign = top
  zindex = 1
}

label {
  monitor =
  text = cmd[update:30000] awk '{s=int($1); d=int(s/86400); h=int((s%86400)/3600); m=int((s%3600)/60); if (d>0) printf "up  %dd  %02dh  %02dm", d, h, m; else if (h>0) printf "up  %dh  %02dm", h, m; else printf "up  %dm", m}' /proc/uptime
  color = $lock_fg
  font_size = 38
  font_family = $font
  position = -800, 186
  halign = center
  valign = bottom
  zindex = 3
}

label {
  monitor =
  text = cmd[update:15000] ~/.dotfiles/asahi/bin/asahi-battery lock
  color = $lock_muted
  font_size = 30
  font_family = $font
  position = -800, 106
  halign = center
  valign = bottom
  zindex = 3
}

input-field {
  monitor =
  size = 832, 134
  outline_thickness = 2
  inner_color = rgba(00000000)
  outer_color = $lock_ring
  check_color = $lock_check
  fail_color = $lock_fail
  capslock_color = $lock_fail
  font_color = $lock_fg
  font_family = $font
  fade_on_empty = false
  rounding = -1
  placeholder_text = <span alpha='60%'>Password</span>
  fail_text = Failed ($ATTEMPTS)
  check_text = Checking…
  dots_size = 0.22
  dots_spacing = 0.35
  dots_center = true
  dots_rounding = -1
  shadow_passes = 0
  position = 0, 106
  halign = center
  valign = bottom
  zindex = 4
}

label {
  monitor =
  text = $LAYOUT[de]
  color = $lock_muted
  font_size = 26
  font_family = $font
  position = -339, 154
  halign = center
  valign = bottom
  zindex = 5
}

label {
  monitor =
  text = cmd[update:1000] date +"<span weight='bold'>%H:%M</span><span alpha='55%'>:%S</span>"
  color = $lock_fg
  font_size = 51
  font_family = $font
  position = 832, 176
  halign = center
  valign = bottom
  zindex = 3
}

label {
  monitor =
  text = cmd[update:60000] date +"%A  ·  %-d %B"
  color = $lock_muted
  font_size = 30
  font_family = $font
  position = 832, 106
  halign = center
  valign = bottom
  zindex = 3
}

# The cutout is 74 framebuffer rows. The label starts below that.
label {
  monitor =
  text = cmd[update:3600000] cat /etc/hostname
  color = $lock_fg
  font_size = 35
  font_family = $font
  position = 0, -92
  halign = center
  valign = top
  zindex = 3
}
