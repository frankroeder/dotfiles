$font = Cascadia Mono NF
$lock_wall = ~/.local/state/asahi/lock-wallpaper

# Mocha fallback, then wallpaper-adaptive colors from asahi-autotheme.
source = ~/.dotfiles/asahi/hypr/hyprlock-theme.conf
source = ~/.local/state/asahi-theme/hyprlock.conf

# Dock lock. Widget positions are framebuffer pixels (3024×1964 at scale 2),
# y-up from the bottom edge. The date sits under the clock: on one line,
# Wednesday still crosses a centered password field.

general {
  hide_cursor = true
  ignore_empty_input = true
  immediate_render = true
}

auth {
  pam:enabled = true
}

animations {
  enabled = true
  bezier = linear, 1, 1, 0, 0
  animation = fadeIn, 1, 5, linear
  animation = fadeOut, 1, 5, linear
  animation = inputFieldDots, 1, 2, linear
}

background {
  monitor =
  path = $lock_wall
  color = $lock_bg
  blur_passes = 0
}

# 12% black over the wallpaper. blur brightness does nothing while blur_passes is 0.
shape {
  monitor =
  size = 100%, 100%
  color = rgba(0, 0, 0, 0.12)
  rounding = 0
  border_size = 0
  position = 0, 0
  halign = left
  valign = bottom
  zindex = 0
}

shape {
  monitor =
  size = 100%, 280
  color = $lock_bg
  rounding = 0
  border_size = 0
  position = 0, 0
  halign = center
  valign = bottom
  zindex = 1
}

shape {
  monitor =
  size = 100%, 1
  color = $lock_muted
  rounding = 0
  border_size = 0
  position = 0, 280
  halign = center
  valign = bottom
  zindex = 2
}

label {
  monitor =
  text = cmd[update:30000] awk '{s=int($1); d=int(s/86400); h=int((s%86400)/3600); m=int((s%3600)/60); if (d>0) printf "up  %dd  %02dh  %02dm", d, h, m; else if (h>0) printf "up  %dh  %02dm", h, m; else printf "up  %dm", m}' /proc/uptime
  color = $lock_fg
  font_size = 56
  font_family = $font
  position = 64, 143
  halign = left
  valign = bottom
  zindex = 3
}

label {
  monitor =
  text = cmd[update:15000] ~/.dotfiles/asahi/bin/asahi-battery lock
  color = $lock_fg
  font_size = 52
  font_family = $font
  position = 64, 63
  halign = left
  valign = bottom
  zindex = 3
}

input-field {
  monitor =
  size = 1000, 176
  outline_thickness = 2
  inner_color = $lock_bg
  outer_color = $lock_accent
  check_color = $lock_check
  fail_color = $lock_fail
  capslock_color = $lock_fail
  font_color = $lock_fg
  font_family = $font
  fade_on_empty = false
  rounding = 16
  placeholder_text = Password
  fail_text = Failed ($ATTEMPTS)
  check_text = Checking…
  dots_size = 0.2
  dots_spacing = 0.15
  dots_center = true
  dots_rounding = -1
  shadow_passes = 0
  position = 0, 52
  halign = center
  valign = bottom
  zindex = 4
}

label {
  monitor =
  text = $LAYOUT[de]
  color = $lock_fg
  font_size = 36
  font_family = $font
  position = -432, 112
  halign = center
  valign = bottom
  zindex = 5
}

label {
  monitor =
  text = cmd[update:1000] date +"<span weight='bold'>%H:%M:%S</span>"
  color = $lock_fg
  font_size = 72
  font_family = $font
  position = -64, 120
  halign = right
  valign = bottom
  zindex = 3
}

label {
  monitor =
  text = cmd[update:60000] date +"%A  ·  %-d %B"
  color = $lock_fg
  font_size = 44
  font_family = $font
  position = -64, 69
  halign = right
  valign = bottom
  zindex = 3
}

# The cutout is 74 framebuffer rows. The box starts below that.
label {
  monitor =
  text = cmd[update:3600000] cat /etc/hostname
  color = $lock_fg
  font_size = 44
  font_family = $font
  position = 0, -120
  halign = center
  valign = top
  zindex = 3
}
