$font = Cascadia Mono NF
# The intro's first frame when the wallpaper has one (WallpaperService.linkLockScreen), else the still: unlock plays
# on from it, behind the windows.
$lock_wall = ~/.local/state/asahi/lock-screen

# Mocha fallback, then wallpaper-adaptive colors from asahi-autotheme.
source = ~/.dotfiles/asahi/hypr/hyprlock-theme.conf
source = ~/.local/state/asahi-theme/hyprlock.conf

# One centered row [uptime / battery]  [password]  [clock / date] at fixed offsets from the centre (hyprlock
# left/right anchor to the monitor edge), on a soft fade of the scheme's background. Above the pill the Touch ID orb:
# a glass disc with a hairline ring, the state glyph inside and a caption under it (asahi-lock-touchid). Positions are
# framebuffer pixels, y-up from the bottom edge; the row fits the Dell 2560.

general {
  hide_cursor = true
  ignore_empty_input = true
  immediate_render = true
}

# Touch ID (Aurora: fprintd over /dev/sep-bio) beside the password; without enrolled prints it stays idle.
auth {
  pam:enabled = true
  fingerprint:enabled = true
  # $FPRINTPROMPT for the orb (asahi-lock-touchid): empty until fprintd's verify has started, then `ready`; `reading`
  # while fprintd reports a finger on the sensor.
  fingerprint:ready_message = ready
  fingerprint:present_message = reading
}

animations {
  enabled = true
  bezier = linear, 1, 1, 0, 0
  bezier = out, 0.16, 1, 0.3, 1
  animation = fadeIn, 1, 5, linear
  # No fade-out: it dims the lock image to grey for 0.5 s before the desktop (the intro's first frame) pops in, which
  # read as a jump to the darker last frame and back (2026-11-09).
  animation = fadeOut, 0
  animation = inputFieldDots, 1, 2, linear
  animation = inputFieldColors, 1, 3, out
}

background {
  monitor =
  path = $lock_wall
  color = $lock_bg
  blur_passes = 0
}

# Bottom fade behind the row and the orb, top fade behind the hostname (scheme background), written by
# asahi-autotheme. Left-anchored: hyprlock mis-centers images wider than the monitor.
image {
  monitor =
  path = ~/.local/state/asahi-theme/lock-fade-bottom.png
  size = 620
  rounding = 0
  border_size = 0
  position = 0, 0
  halign = left
  valign = bottom
  zindex = 1
}

image {
  monitor =
  path = ~/.local/state/asahi-theme/lock-fade-top.png
  size = 260
  rounding = 0
  border_size = 0
  position = 0, 0
  halign = left
  valign = top
  zindex = 1
}

label {
  monitor =
  text = cmd[update:30000] awk '{s=int($1); d=int(s/86400); h=int((s%86400)/3600); m=int((s%3600)/60); if (d>0) printf "up  %dd  %02dh  %02dm", d, h, m; else if (h>0) printf "up  %dh  %02dm", h, m; else printf "up  %dm", m}' /proc/uptime
  color = $lock_fg
  font_size = 38
  font_family = $font
  position = -800, 186
  halign = center
  valign = bottom
  zindex = 3
}

label {
  monitor =
  text = cmd[update:15000] ~/.dotfiles/asahi/bin/asahi-battery lock
  color = $lock_muted
  font_size = 30
  font_family = $font
  position = -800, 106
  halign = center
  valign = bottom
  zindex = 3
}

# Two rings, the dots and the CAPS tag: four fields, one input. hyprlock pads the dots only by (height - dot) / 2,
# so on the wide pill they ran under the layout label: the 624 field draws the dots
# and texts (13 dots max). Outline is drawn outside the box and cannot change
# thickness per state, so Caps Lock is a second ring: 8px, invisible until caps is
# on, then inputFieldColors eases it in. The 3px accent ring eases out at the same time.
# Check/fail on the thick ring stay clear — a real fail color would also draw it
# when Caps Lock is off. A failed attempt replaces the caps color for fail_timeout.
input-field {
  monitor =
  size = 832, 134
  outline_thickness = 8
  inner_color = rgba(00000000)
  outer_color = rgba(00000000)
  check_color = rgba(00000000)
  fail_color = rgba(00000000)
  capslock_color = $lock_caps
  font_color = rgba(00000000)
  fade_on_empty = false
  rounding = -1
  placeholder_text =
  fail_text =
  check_text =
  shadow_passes = 0
  position = 0, 106
  halign = center
  valign = bottom
  zindex = 3
}

# The capsule: accent gradient ring, no glow (a blurry haze). Its fill is solid $lock_bg, not glass: the CAPS word
# below is that colour and must vanish on it.
input-field {
  monitor =
  size = 832, 134
  outline_thickness = 3
  inner_color = $lock_bg
  outer_color = $lock_ring
  check_color = $lock_check
  fail_color = $lock_fail
  capslock_color = rgba(00000000)
  font_color = rgba(00000000)
  fade_on_empty = false
  rounding = -1
  placeholder_text =
  fail_text =
  check_text =
  shadow_passes = 0
  position = 0, 106
  halign = center
  valign = bottom
  zindex = 4
}

# Dots and texts. Never swap_font_color: on a borderless field it redraws the lock screen every frame (hyprlock
# 0.9.7 asks for the placeholder again per frame). Without it the field's box fills with the state's colour, so those
# are clear and "Failed" / "Checking…" are coloured by markup (pango wants #rrggbb; hyprlang reads ## as #).
# invert_numlock + a clear numlock_color: a state colour is always the target, so the dots keep $lock_fg (else a
# fingerprint miss while typing turns them the clear fail colour).
input-field {
  monitor =
  size = 624, 134
  outline_thickness = 0
  inner_color = rgba(00000000)
  outer_color = rgba(00000000)
  check_color = rgba(00000000)
  fail_color = rgba(00000000)
  capslock_color = rgba(00000000)
  numlock_color = rgba(00000000)
  invert_numlock = true
  font_color = $lock_fg
  font_family = $font
  fade_on_empty = false
  rounding = -1
  placeholder_text = <span alpha='55%'>Password</span>
  fail_text = <span foreground='##$lock_hexfail'>Failed ($ATTEMPTS)</span>
  check_text = <span foreground='##$lock_hexcheck'>Checking…</span>
  dots_size = 0.22
  dots_spacing = 0.35
  dots_center = true
  dots_rounding = -1
  shadow_passes = 0
  position = 0, 106
  halign = center
  valign = bottom
  zindex = 5
}

label {
  monitor =
  text = $LAYOUT[de]
  color = $lock_muted
  font_size = 26
  font_family = $font
  position = -339, 154
  halign = center
  valign = bottom
  zindex = 5
}

# The CAPS tag opposite the layout name, hyprlock's own (a label cannot follow a key without polling): a borderless
# field whose box fills with capslock_color while Caps Lock is on, under a static word in $lock_bg that vanishes on
# the capsule without it. Same baseline as `de`. Like the thick ring it steps aside while "Failed" shows.
input-field {
  monitor =
  size = 100, 46
  outline_thickness = 0
  inner_color = rgba(00000000)
  outer_color = rgba(00000000)
  check_color = rgba(00000000)
  fail_color = rgba(00000000)
  capslock_color = $lock_caps
  font_color = rgba(00000000)
  fade_on_empty = false
  rounding = 12
  placeholder_text =
  fail_text =
  check_text =
  shadow_passes = 0
  position = 346, 150
  halign = center
  valign = bottom
  zindex = 6
}

label {
  monitor =
  text = <b>CAPS</b>
  color = $lock_bg
  font_size = 26
  font_family = $font
  position = 346, 154
  halign = center
  valign = bottom
  zindex = 7
}

# Touch ID orb: a glass disc with a hairline ring and the glyph in the state's colour; once something happens the
# disc turns solid in that colour (asahi-lock-touchid: one script, three labels; states there). hyprlock re-runs the
# labels at once on its fingerprint events; update:5000 is only a tick for what time alone changes (the script relies
# on that 5 s). Ring and solid disc are one label: Adwaita Sans' large circle, outline (Thin: a 3 px line) or filled,
# 1.825 x the font size across, centred 1.62 x the font size over the label's position: here 188 px on the glass.
shape {
  monitor =
  size = 188, 188
  color = $lock_glass
  rounding = -1
  border_size = 0
  shadow_passes = 0
  position = 0, 330
  halign = center
  valign = bottom
  zindex = 4
}

label {
  monitor =
  text = cmd[update:5000] ~/.dotfiles/asahi/bin/asahi-lock-touchid ring "$FPRINTPROMPT" "$lock_fg" "$lock_muted" "$lock_accent" "$lock_accent2" "$lock_warn" "$lock_fail" "$lock_on"
  color = $lock_fg
  font_size = 103
  font_family = $font
  position = 0, 256
  halign = center
  valign = bottom
  zindex = 5
}

label {
  monitor =
  text = cmd[update:5000] ~/.dotfiles/asahi/bin/asahi-lock-touchid glyph "$FPRINTPROMPT" "$lock_fg" "$lock_muted" "$lock_accent" "$lock_accent2" "$lock_warn" "$lock_fail" "$lock_on"
  color = $lock_fg
  font_size = 96
  font_family = $font
  position = 0, 352
  halign = center
  valign = bottom
  zindex = 6
}

label {
  monitor =
  text = cmd[update:5000] ~/.dotfiles/asahi/bin/asahi-lock-touchid caption "$FPRINTPROMPT" "$lock_fg" "$lock_muted" "$lock_accent" "$lock_accent2" "$lock_warn" "$lock_fail" "$lock_on"
  color = $lock_fg
  font_size = 24
  font_family = $font
  position = 0, 268
  halign = center
  valign = bottom
  zindex = 5
}

# Hours bold, seconds in the accent. The seconds are most of what the idle lock screen costs (a run and a frame a
# second); hyprlock's own $TIME (HH:MM) would cost nothing.
label {
  monitor =
  text = cmd[update:1000] date +"<span weight='bold'>%H:%M</span><span foreground='##$lock_hexaccent'>:%S</span>"
  color = $lock_fg
  font_size = 51
  font_family = $font
  position = 832, 176
  halign = center
  valign = bottom
  zindex = 3
}

label {
  monitor =
  text = cmd[update:60000] date +"%A  ·  %-d %B"
  color = $lock_muted
  font_size = 30
  font_family = $font
  position = 832, 106
  halign = center
  valign = bottom
  zindex = 3
}

# The cutout is 74 framebuffer rows. The label starts below that.
label {
  monitor =
  text = cmd[update:3600000] cat /etc/hostname
  color = $lock_fg
  font_size = 35
  font_family = $font
  position = 0, -92
  halign = center
  valign = top
  zindex = 3
}
