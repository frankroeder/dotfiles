general {
  # asahi-lock = hyprlock in a restart loop; a crashed locker never leaves the
  # session on Hyprland's lockdead screen (see the script header).
  lock_cmd = ~/.dotfiles/asahi/bin/asahi-lock
  # Quiesce DCP before Asahi s2idle. after_sleep cannot help a hang that never
  # reaches PM: suspend exit (lid/power do not wake; SMC 10s hold).
  before_sleep_cmd = ~/.dotfiles/asahi/bin/asahi-idle-brightness off; ~/.dotfiles/asahi/bin/asahi-dpms off; loginctl lock-session
  after_sleep_cmd = ~/.dotfiles/asahi/bin/asahi-idle wake
  # 3 = hold the sleep delay until hyprlock really holds the session lock
  # (hyprland_lock_notifier), so s2idle never starts under a half-started locker.
  inhibit_sleep = 3
}

# Screensaver first, then half-dim under it, then lock + display/keyboard off
# at the macOS display-off defaults (2 min battery / 10 min AC, password
# immediately), s2idle a minute later. Each listener no-ops on the other
# power source and under stay-awake.
#   battery: saver 1 min, dim 1.5 min, off 2 min, sleep 3 min
#   AC:      saver 3 min, dim 5 min,   off 10 min, sleep 11 min
$idle = ~/.dotfiles/asahi/bin/asahi-idle
$wake = ~/.dotfiles/asahi/bin/asahi-idle wake

listener {
  timeout = 60
  on-timeout = $idle battery saver
  on-resume = $wake
}

listener {
  timeout = 90
  on-timeout = $idle battery dim
  on-resume = $wake
}

listener {
  timeout = 120
  on-timeout = $idle battery off
  on-resume = $wake
}

listener {
  timeout = 180
  on-timeout = $idle battery sleep
}

listener {
  timeout = 180
  on-timeout = $idle ac saver
  on-resume = $wake
}

listener {
  timeout = 300
  on-timeout = $idle ac dim
  on-resume = $wake
}

listener {
  timeout = 600
  on-timeout = $idle ac off
  on-resume = $wake
}

listener {
  timeout = 660
  on-timeout = $idle ac sleep
}
