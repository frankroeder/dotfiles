general {
  lock_cmd = pidof hyprlock || hyprlock --config ~/.config/hypr/hyprlock.conf
  # Quiesce DCP before Asahi s2idle.
  before_sleep_cmd = ~/.dotfiles/asahi/bin/asahi-idle-brightness off; ~/.dotfiles/asahi/bin/asahi-dpms off; loginctl lock-session
  after_sleep_cmd = ~/.dotfiles/asahi/bin/asahi-dpms on; ~/.dotfiles/asahi/bin/asahi-idle-brightness restore
}

# `asahi-stay-awake unless` skips the step while the bar's stay-awake chip is on.
listener {
  timeout = 120
  on-timeout = ~/.dotfiles/asahi/bin/asahi-stay-awake unless ~/.dotfiles/asahi/bin/asahi-idle-brightness dim
  on-resume = ~/.dotfiles/asahi/bin/asahi-idle-brightness restore
}

listener {
  timeout = 180
  on-timeout = ~/.dotfiles/asahi/bin/asahi-stay-awake unless ~/.dotfiles/asahi/bin/asahi-screensaver start
  on-resume = ~/.dotfiles/asahi/bin/asahi-screensaver stop
}

listener {
  timeout = 600
  on-timeout = ~/.dotfiles/asahi/bin/asahi-stay-awake unless sh -c "~/.dotfiles/asahi/bin/asahi-screensaver stop; loginctl lock-session"
}

listener {
  timeout = 900
  on-timeout = ~/.dotfiles/asahi/bin/asahi-stay-awake unless sh -c "~/.dotfiles/asahi/bin/asahi-idle-brightness off; ~/.dotfiles/asahi/bin/asahi-dpms off"
  on-resume = ~/.dotfiles/asahi/bin/asahi-dpms on; ~/.dotfiles/asahi/bin/asahi-idle-brightness restore
}
