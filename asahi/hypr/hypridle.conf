general {
  lock_cmd = pidof hyprlock || hyprlock --config ~/.config/hypr/hyprlock.conf
  # Quiesce DCP before Asahi s2idle.
  before_sleep_cmd = ~/.dotfiles/asahi/bin/asahi-idle-brightness off; ~/.dotfiles/asahi/bin/asahi-dpms off; loginctl lock-session
  after_sleep_cmd = ~/.dotfiles/asahi/bin/asahi-dpms on; ~/.dotfiles/asahi/bin/asahi-idle-brightness restore
}

listener {
  timeout = 120
  on-timeout = test ! -e ~/.local/state/asahi/stay-awake && ~/.dotfiles/asahi/bin/asahi-idle-brightness dim
  on-resume = ~/.dotfiles/asahi/bin/asahi-idle-brightness restore
}

listener {
  timeout = 180
  on-timeout = test ! -e ~/.local/state/asahi/stay-awake && ~/.dotfiles/asahi/bin/asahi-screensaver start
  on-resume = ~/.dotfiles/asahi/bin/asahi-screensaver stop
}

listener {
  timeout = 600
  on-timeout = test ! -e ~/.local/state/asahi/stay-awake && ~/.dotfiles/asahi/bin/asahi-screensaver stop; test ! -e ~/.local/state/asahi/stay-awake && loginctl lock-session
}

listener {
  timeout = 900
  on-timeout = test ! -e ~/.local/state/asahi/stay-awake && ~/.dotfiles/asahi/bin/asahi-idle-brightness off; test ! -e ~/.local/state/asahi/stay-awake && ~/.dotfiles/asahi/bin/asahi-dpms off
  on-resume = ~/.dotfiles/asahi/bin/asahi-dpms on; ~/.dotfiles/asahi/bin/asahi-idle-brightness restore
}
