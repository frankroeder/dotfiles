# Default mocha lock colors. asahi-autotheme overwrites
# ~/.local/state/asahi-theme/hyprlock.conf from the wallpaper (and writes the
# fade images beside it; without them those widgets stay empty).
$lock_bg = rgb(1e1e2e)
$lock_fg = rgb(cdd6f4)
$lock_muted = rgb(a6adc8)
$lock_fail = rgb(f38ba8)
$lock_caps = rgb(f9e2af)
$lock_warn = rgb(f9e2af)
$lock_check = rgba(a6e3a1ee) rgba(94e2d5ee) 120deg
# The two accents (asahi-autotheme: the wallpaper accent pushed vivid, and its +40° neighbour).
$lock_accent = rgb(cba6f7)
$lock_accent2 = rgb(f5c2e7)
$lock_ring = rgba(cba6f7ee) rgba(f5c2e7ee) 45deg
$lock_glass = rgba(1e1e2ea6)
# Text on an accent fill (the solid Touch ID disc): crust.
$lock_on = rgb(11111b)
# Bare rrggbb for pango markup (the clock's seconds, "Failed" / "Checking…"): $lock_accent, $lock_fail, $lock_check.
$lock_hexaccent = cba6f7
$lock_hexfail = f38ba8
$lock_hexcheck = a6e3a1
