# Default mocha lock colors. asahi-autotheme overwrites
# ~/.local/state/asahi-theme/hyprlock.conf from the wallpaper.
$lock_bg = rgb(1e1e2e)
$lock_fg = rgb(cdd6f4)
$lock_accent = rgb(f5c2e7)
$lock_muted = rgb(a6adc8)
$lock_ok = rgb(a6e3a1)
$lock_fail = rgb(f38ba8)
$lock_shadow = rgba(11111bcc)
$lock_outer = rgba(f5c2e7ee) rgba(cba6f7ee) 45deg
$lock_check = rgba(a6e3a1ee) rgba(94e2d5ee) 120deg
$lock_fail_grad = rgba(f38ba8ee) rgba(eb6f92ee) 40deg
