# Apple Silicon HID race (Asahi).
#
# The internal keyboard and trackpad arrive over dockchannel-hid and first bind
# to hid-generic, then get destroyed and re-created when the real drivers load.
# That churn reshuffles the input event minors while udev, logind and the
# compositor are all starting, and on an unlucky boot logind's TakeDevice loses
# the race: libinput never retries, so the device is dead for the whole session.
# Binding correctly on first registration avoids the churn entirely.
#
# hid_magicmouse (trackpad) is a module on Aurora's kernel; Fedora's Asahi
# kernel built it in (`modinfo -n hid_magicmouse` said "(builtin)"), where
# listing it is a no-op. Check before adding a driver — dracut is happy to
# build an image around a module that does not exist.
# Aurora: aurora-peripherals' pre-udev hook loads dockchannel-hid, so the devices register in the initramfs; without
# this, hid_magicmouse only beats the built-in hid_generic by the ~35 ms its modalias load (keyboard uevent) gets.
#
# Second benefit: dracut also ships /etc/modprobe.d/hid_apple.conf, so with the
# module in the initramfs `fnmode=1` applies on the very first bind rather than
# after a late load.
force_drivers+=" hid_apple hid_magicmouse "
# Keyboard light at the LUKS prompt: its PWM driver (leds_pwm is built in) + udev rule (asahi/udev/90-asahi-kbd-backlight.rules).
force_drivers+=" pwm_apple "
install_items+=" /etc/udev/rules.d/90-asahi-kbd-backlight.rules "
