## Built-in mic as one MONO source, "MacBook Mic" (asahi_mic). effect_output.j414-mic is 1ch
## AUX0 (stereo recorders: left only): a software-dsp copy stage relabels it MONO, and
## hide-parent hides the AUX0 node, so apps see one mic and one mute. Not a pw loopback (AUX0
## stayed visible: mute bypass); daemon node.rules can't remap a filter's channels. A new filter
## reads 2 ch until its first capture: prime once with `timeout 1 pw-record --target asahi_mic /dev/null`.

node.software-dsp.rules = [
  {
    matches = [ { node.name = "effect_output.j414-mic" } ]
    actions = {
      create-filter = {
        filter-graph = {
          node.description = "MacBook Mic"
          media.name = "MacBook Mic"
          filter.graph = {
            nodes = [ { type = builtin, label = copy, name = copy } ]
          }
          audio.channels = 1
          capture.props = {
            node.name = "asahi_mic.capture"
            target.object = "effect_output.j414-mic"
            node.passive = true
            stream.dont-remix = true
            audio.channels = 1
            audio.position = [ MONO ]
          }
          playback.props = {
            node.name = "asahi_mic"
            media.class = "Audio/Source"
            audio.channels = 1
            audio.position = [ MONO ]
            priority.session = 2010
          }
        }
        hide-parent = true
      }
    }
  }
]
