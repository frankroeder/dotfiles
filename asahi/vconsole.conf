# The authority for the console font, including the getty login prompt.
#
# asahi-tty-font.service cannot do this job: systemd-vconsole-setup is
# udev-triggered and re-runs several times as the DRM devices appear, the last
# one landing ~460ms *after* the service, so whatever setfont put there gets
# overwritten from this file. Set the font here and every re-run reapplies it.
#
# ter-v32n is the largest Terminus in kbd (32px ceiling). On this 3024x1964
# panel that is a 189x61 grid; eurlatgr was 16px, i.e. half the height.
#
# KEYMAP is the console counterpart of hypr/conf.d/input.lua (kb_layout=de,
# kb_variant=mac_nodeadkeys) so tty1 and the Hyprland session agree on German.
#
# It must be a *legacy* kbd map, not an xkb-converted one. Everything under
# /usr/lib/kbd/keymaps/xkb/ -- "de", "de-nodeadkeys", "de-mac_nodeadkeys" --
# fails to compile ("lk_add_key called with bad keycode -1", unknown keysyms),
# so systemd-vconsole-setup would silently leave the console on US.
# The "mac-*" maps compile but carry PowerPC ADB keycodes (keycode 21 is "4",
# not "z"); hid_apple reports normal evdev keycodes, so those would scramble it.
# Check a candidate before switching:
#   loadkeys --mktable <name> >/dev/null && echo compiles
KEYMAP="de-latin1-nodeadkeys"
FONT="ter-v32n"
