# inotify instances (idea: Gren-95): the default 128 is per user; every FileView / Qt file watcher, Ghostty, Firefox and
# each Flatpak hold some (49 in use 2026-11-21), and running out takes the session D-Bus down. Memory per instance is
# tiny; the per-watch limit (max_user_watches) is already large on this kernel.
fs.inotify.max_user_instances = 1024
