# zram is the only swap: prefer it over dropping cache, read one page at a time.
# From omarchy-mx-mac (zram part).
vm.swappiness = 150
vm.page-cluster = 0
# kswapd: no reclaim bursts after fragmentation (boost 0), wake a bit earlier (125 = 1.25 %).
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
